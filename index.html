<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <meta name="description" content="PyroLens: a harmonized MODIS + VIIRS Burning Activity Calendar for any area of interest." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme (mirrors ThemeContext).
      (function () {
        var t = "dark";
        try {
          var p = localStorage.getItem("pyrolens.theme");
          t = p === "light" || p === "dark" ? p : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>PyroLens · Burning Activity Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
