services:
  - type: web
    name: pyrolens
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/firms/*
        destination: https://firms.modaps.eosdis.nasa.gov/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_NASA_FIRMS_MAP_KEY
        sync: false
